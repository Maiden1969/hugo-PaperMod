<link rel="stylesheet" href="https://ustc510.asia/waline/waline.css" />
<script src="https://ustc510.asia/mathjax/es5/tex-svg.js"></script>
<div id="waline" class="no-math tex2jax_ignore"></div>
<script type="module">
  import { init } from 'https://ustc510.asia/waline/waline.js';
  init({
    el: '#waline',
    serverURL: 'https://ustc510.asia',
    dark: 'body.dark',
    texRenderer: (blockMode, tex) =>
      window.MathJax.startup.adaptor.outerHTML(
        window.MathJax.tex2svg(tex, {
          display: blockMode,
        }),
      ),
  });
</script>
